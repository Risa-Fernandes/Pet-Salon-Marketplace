<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PawSalon - Manage Listing</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>

@import url('https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Urbanist',sans-serif;
}

:root{
    --primary:#6366f1;
    --secondary:#8b5cf6;
    --pink:#ec4899;
    --cyan:#06b6d4;
    --orange:#f59e0b;
    --green:#10b981;
    --dark:#1f2937;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    color:var(--dark);

    background:
    radial-gradient(circle at top left,#bfdbfe 0%,transparent 25%),
    radial-gradient(circle at top right,#fbcfe8 0%,transparent 25%),
    radial-gradient(circle at bottom right,#c4b5fd 0%,transparent 25%),
    linear-gradient(135deg,#eef2ff,#f8fafc,#fdf4ff);

    position:relative;
}

/* FLOATING BLOBS */

body::before{
    content:'';
    position:fixed;
    width:550px;
    height:550px;
    border-radius:50%;
    background:linear-gradient(135deg,#60a5fa,#818cf8,#ec4899);
    top:-180px;
    left:-120px;
    filter:blur(120px);
    opacity:0.35;
    animation:floatBlob1 10s infinite alternate ease-in-out;
    z-index:-2;
}

body::after{
    content:'';
    position:fixed;
    width:500px;
    height:500px;
    border-radius:50%;
    background:linear-gradient(135deg,#06b6d4,#14b8a6,#8b5cf6);
    bottom:-180px;
    right:-120px;
    filter:blur(120px);
    opacity:0.35;
    animation:floatBlob2 12s infinite alternate ease-in-out;
    z-index:-2;
}

@keyframes floatBlob1{
    0%{
        transform:translateY(0px) translateX(0px);
    }
    100%{
        transform:translateY(60px) translateX(40px);
    }
}

@keyframes floatBlob2{
    0%{
        transform:translateY(0px) translateX(0px);
    }
    100%{
        transform:translateY(-50px) translateX(-50px);
    }
}

/* NAVBAR */

.navbar{
    margin-top:20px;
    padding:16px 30px;
    background:rgba(255,255,255,0.35);
    backdrop-filter:blur(24px);
    border-radius:40px;
    width:92%;
    left:50%;
    transform:translateX(-50%);
    border:1px solid rgba(255,255,255,0.25);
    box-shadow:0 20px 45px rgba(99,102,241,0.08);
}

.navbar-brand{
    font-size:34px;
    font-weight:800;
    background:linear-gradient(90deg,#2563eb,#7c3aed,#ec4899);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.btn-login{
    color:var(--dark);
    font-weight:700;
    padding:10px 24px;
    border-radius:18px;
    transition:0.3s;
}

.btn-login:hover{
    transform:translateY(-3px);
}

.btn-owner{
    background:linear-gradient(135deg,#6366f1,#8b5cf6,#ec4899);
    color:white!important;
    border:none;
    padding:12px 28px;
    border-radius:18px;
    font-weight:700;
    transition:0.4s;
    box-shadow:0 15px 30px rgba(99,102,241,0.2);
}

.btn-owner:hover{
    transform:translateY(-4px) scale(1.03);
    color:white;
}

/* MAIN CONTAINER */

.main-container{
    width:92%;
    margin:auto;
    margin-top:40px;
    margin-bottom:50px;
}

/* TOP HEADER */

.page-header{
    background:rgba(255,255,255,0.35);
    backdrop-filter:blur(24px);
    border-radius:35px;
    padding:35px;
    margin-bottom:30px;
    border:1px solid rgba(255,255,255,0.25);
    box-shadow:0 20px 45px rgba(99,102,241,0.08);
}

.page-header h2{
    font-size:38px;
    font-weight:800;

    background:linear-gradient(90deg,#2563eb,#7c3aed,#ec4899);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.page-header p{
    margin:0;
    color:#64748b;
    font-weight:600;
}

/* FORM GRID */

.form-wrapper{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:28px;
    align-items:start;
}

/* FORM SECTION */

.form-section{
    background:rgba(255,255,255,0.38);
    backdrop-filter:blur(24px);
    border-radius:32px;
    padding:30px;
    border:1px solid rgba(255,255,255,0.25);
    box-shadow:0 20px 45px rgba(99,102,241,0.08);
    transition:0.4s;
}

.form-section:hover{
    transform:translateY(-4px);
}

.full-width{
    grid-column:1 / -1;
}

/* TITLES */

.section-title{
    font-size:24px;
    font-weight:800;
    margin-bottom:25px;

    background:linear-gradient(90deg,#2563eb,#7c3aed,#ec4899);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    display:flex;
    align-items:center;
    gap:12px;
}

/* LABELS */

.form-label{
    font-weight:700;
    margin-bottom:10px;
    color:#374151;
}

/* INPUTS */

.form-control,
.form-select{
    border:none!important;
    background:rgba(255,255,255,0.7)!important;
    border-radius:18px!important;
    padding:14px 18px!important;
    min-height:54px;
    box-shadow:none!important;
    font-weight:600!important;
}

.form-control:focus,
.form-select:focus{
    background:white!important;
    border:2px solid #8b5cf6!important;
    box-shadow:none!important;
}

/* MAP */

#salonMap{
    border-radius:24px;
}

/* UPLOAD */

.upload-area{
    border:2px dashed rgba(99,102,241,0.25);
    border-radius:28px;
    padding:55px;
    text-align:center;
    background:rgba(255,255,255,0.3);
    cursor:pointer;
    transition:0.4s;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    min-height:260px;
}

.upload-area:hover{
    border-color:#8b5cf6;
    background:rgba(255,255,255,0.45);
}

.upload-area i{
    font-size:65px;

    background:linear-gradient(135deg,#38bdf8,#8b5cf6,#ec4899);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.img-preview{
    width:100%;
    max-height:250px;
    object-fit:cover;
    border-radius:24px;
    margin-top:20px;
}

/* SERVICES TABLE */

.services-table-wrapper{
    overflow-x:auto;
}

.services-table{
    width:100%;
    border-collapse:separate;
    border-spacing:0 14px;
}

.services-table th{
    font-size:15px;
    color:#475569;
    padding:0 12px 10px;
    font-weight:800;
}

.services-table td{
    background:rgba(255,255,255,0.55);
    padding:12px;
}

.services-table tr td:first-child{
    border-radius:18px 0 0 18px;
}

.services-table tr td:last-child{
    border-radius:0 18px 18px 0;
}

.remove-service{
    width:42px;
    height:42px;
    border-radius:12px;
    background:linear-gradient(135deg,#f43f5e,#e11d48);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:0.3s;
}

.remove-service:hover{
    transform:scale(1.08);
}

/* BUTTONS */

.btn-add-service{
    background:linear-gradient(135deg,#06b6d4,#6366f1);
    color:white;
    border:none;
    border-radius:16px;
    padding:12px 20px;
    font-weight:700;
    margin-bottom:18px;
}

.btn-add-service:hover{
    color:white;
    transform:translateY(-2px);
}

.save-btn{
    background:linear-gradient(135deg,#6366f1,#8b5cf6,#ec4899);
    border:none;
    color:white;
    border-radius:20px;
    padding:16px 40px;
    font-size:18px;
    font-weight:700;
    box-shadow:0 20px 35px rgba(99,102,241,0.22);
    transition:0.4s;
}

.save-btn:hover{
    transform:translateY(-4px) scale(1.03);
}

/* RESPONSIVE */

@media(max-width:991px){

    .form-wrapper{
        grid-template-columns:1fr;
    }

    .page-header{
        text-align:center;
    }

}

@media(max-width:768px){

    .navbar{
        width:96%;
        padding:14px 20px;
    }

    .main-container{
        width:96%;
    }

    .page-header h2{
        font-size:30px;
    }

    .services-table{
        min-width:700px;
    }

}

</style>

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg position-relative">

    <div class="container-fluid">

        <a class="navbar-brand" href="/salon/dashbord">
            <i class="fas fa-paw"></i> PawSalon
        </a>

        <div class="ms-auto d-flex align-items-center">

            <a href="/adminviewsalon" class="btn btn-login me-2">
                Back
            </a>

            <a href="/salon/dashbord" class="btn btn-owner">
                Home
            </a>

        </div>

    </div>

</nav>

<!-- MAIN -->

<div class="main-container">

    <!-- HEADER -->

    <div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-3">

        <div>
            <h2>Add Salon Details ✨</h2>
            <p>Create your salon listing with beautiful details and services.</p>
        </div>

        <button type="button"
                class="btn btn-outline-secondary rounded-pill px-4 py-2 fw-bold"
                onclick="history.back()">
            Cancel
        </button>

    </div>

    <!-- FORM -->

    <form id="salonForm">

        <div class="form-wrapper">

            <!-- BASIC INFO -->

            <div class="form-section">

                <h4 class="section-title">
                    <i class="fas fa-store"></i>
                    Basic Info
                </h4>

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Salon Name</label>
                        <input type="text"
                               id="salon_name"
                               class="form-control"
                               placeholder="Enter salon name"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Salon Gov Number</label>
                        <input type="text"
                               id="gov_number"
                               class="form-control"
                               placeholder="Registration number"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Open Time</label>
                        <input type="time"
                               id="open_hours"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Close Time</label>
                        <input type="time"
                               id="close_hours"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Tagline</label>
                        <input type="text"
                               id="tagline"
                               class="form-control"
                               placeholder="Your salon tagline">
                    </div>

                    <div class="col-12">
                        <label class="form-label">Description</label>
                        <textarea id="description"
                                  class="form-control"
                                  rows="5"
                                  placeholder="Write about your salon"></textarea>
                    </div>

                </div>

            </div>

            <!-- LOCATION -->

            <div class="form-section">

                <h4 class="section-title">
                    <i class="fas fa-map-marker-alt"></i>
                    Location
                </h4>

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Street</label>
                        <input type="text"
                               id="street"
                               class="form-control"
                               placeholder="Street address"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">City / District</label>
                        <input type="text"
                               id="city"
                               class="form-control"
                               placeholder="City"
                               required>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Phone Number</label>
                        <input type="text"
                               id="phone"
                               class="form-control"
                               pattern="^[0-9]{10}$"
                               placeholder="10 digit number"
                               required>
                    </div>

                    <div class="col-12 mt-3">

                        <label class="form-label">
                            Location Preview
                        </label>

                        <div class="rounded-4 overflow-hidden shadow-sm"
                             style="height:250px;">

                            <iframe id="salonMap"
                                    width="100%"
                                    height="100%"
                                    style="border:0;"
                                    loading="lazy"
                                    src="https://www.google.com/maps?q=Mumbai&output=embed">
                            </iframe>

                        </div>

                    </div>

                </div>

            </div>

            <!-- IMAGE -->

            <div class="form-section">

                <h4 class="section-title">
                    <i class="fas fa-image"></i>
                    Salon Image
                </h4>

                <div class="upload-area">

                    <input type="file"
                           id="salonImage"
                           accept="image/*"
                           hidden
                           required>

                    <i class="fas fa-cloud-upload-alt mb-3"></i>

                    <h5 class="fw-bold">
                        Upload Salon Image
                    </h5>

                    <p class="text-muted">
                        Click or drag & drop image here
                    </p>

                    <img id="previewImg"
                         class="img-preview d-none">

                </div>

            </div>

            <!-- SERVICES -->

            <div class="form-section">

                <h4 class="section-title">
                    <i class="fas fa-scissors"></i>
                    Services
                </h4>

                <button type="button"
                        id="addServiceBtn"
                        class="btn btn-add-service">

                    <i class="fas fa-plus me-2"></i>
                    Add Service

                </button>

                <div class="services-table-wrapper">

                    <table class="services-table">

                        <thead>

                            <tr>
                                <th>Service Name</th>
                                <th>Price</th>
                                <th>Duration</th>
                                <th width="70">Remove</th>
                            </tr>

                        </thead>

                        <tbody id="servicesContainer">

                            <tr class="service-row">

                                <td>
                                    <input type="text"
                                           class="form-control service-name"
                                           placeholder="Service Name"
                                           required>
                                </td>

                                <td>
                                    <input type="number"
                                           class="form-control service-price"
                                           placeholder="Price"
                                           required>
                                </td>

                                <td>
                                    <input type="number"
                                           class="form-control service-duration"
                                           placeholder="Duration (min)"
                                           required>
                                </td>

                                <td>
                                    <div class="remove-service">
                                        <i class="fas fa-times"></i>
                                    </div>
                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

        <!-- SAVE BUTTON -->

        <div class="text-end mt-4">

            <button class="save-btn">
                <i class="fas fa-save me-2"></i>
                Save Salon
            </button>

        </div>

    </form>

</div>

<!-- SCRIPT -->

<script>

document.addEventListener("DOMContentLoaded", () => {

    const uploadArea = document.querySelector(".upload-area");
    const fileInput = document.getElementById("salonImage");
    const previewImg = document.getElementById("previewImg");

    // CLICK UPLOAD

    uploadArea.addEventListener("click", () => fileInput.click());

    // DRAG OVER

    uploadArea.addEventListener("dragover", (e) => {

        e.preventDefault();

        uploadArea.style.borderColor = "#8b5cf6";

    });

    // DRAG LEAVE

    uploadArea.addEventListener("dragleave", (e) => {

        e.preventDefault();

        uploadArea.style.borderColor = "rgba(99,102,241,0.25)";

    });

    // DROP

    uploadArea.addEventListener("drop", (e) => {

        e.preventDefault();

        const file = e.dataTransfer.files[0];

        if(file){

            fileInput.files = e.dataTransfer.files;

            previewImg.src = URL.createObjectURL(file);

            previewImg.classList.remove("d-none");

        }

    });

    // PREVIEW

    fileInput.addEventListener("change", () => {

        const file = fileInput.files[0];

        if(file){

            previewImg.src = URL.createObjectURL(file);

            previewImg.classList.remove("d-none");

        }

    });

    // ADD SERVICE

    document.getElementById("addServiceBtn")
    .addEventListener("click", () => {

        const container = document.getElementById("servicesContainer");

        const row = document.createElement("tr");

        row.className = "service-row";

        row.innerHTML = `

            <td>
                <input type="text"
                       class="form-control service-name"
                       placeholder="Service Name">
            </td>

            <td>
                <input type="number"
                       class="form-control service-price"
                       placeholder="Price">
            </td>

            <td>
                <input type="number"
                       class="form-control service-duration"
                       placeholder="Duration (min)">
            </td>

            <td>
                <div class="remove-service">
                    <i class="fas fa-times"></i>
                </div>
            </td>

        `;

        container.appendChild(row);

    });

    // REMOVE SERVICE

    document.getElementById("servicesContainer")
    .addEventListener("click", (e) => {

        if(e.target.closest(".remove-service")){

            const rows = document.querySelectorAll(".service-row");

            if(rows.length > 1){

                e.target.closest(".service-row").remove();

            }

        }

    });

    // SUBMIT

    document.getElementById("salonForm")
    .addEventListener("submit", (e) => {

        e.preventDefault();

        const formData = new FormData();

        formData.append("name",
        document.getElementById("salon_name").value);

        formData.append("tagline",
        document.getElementById("tagline").value);

        formData.append("description",
        document.getElementById("description").value);

        formData.append("address",
        document.getElementById("street").value);

        formData.append("city",
        document.getElementById("city").value);

        formData.append("phone",
        document.getElementById("phone").value);

        formData.append("open_hours",
        document.getElementById("open_hours").value);

        formData.append("close_hours",
        document.getElementById("close_hours").value);

        const imageFile =
        document.getElementById("salonImage").files[0];

        if(imageFile){

            formData.append("image", imageFile);

        }

        const services = [];

        document.querySelectorAll(".service-row")
        .forEach(row => {

            const name =
            row.querySelector(".service-name")?.value;

            const price =
            row.querySelector(".service-price")?.value;

            const duration =
            row.querySelector(".service-duration")?.value;

            if(name && price && duration){

                services.push({
                    service_name:name,
                    price,
                    duration
                });

            }

        });

        formData.append("services",
        JSON.stringify(services));

        fetch("http://127.0.0.1:5000/api/salon", {

            method:"POST",
            body:formData

        })
        .then(res=>res.json())
        .then(res=>{

            alert(res.message);

        })
        .catch(err=>console.error(err));

    });

    // MAP UPDATE

    const streetInput =
    document.getElementById("street");

    const cityInput =
    document.getElementById("city");

    const salonMap =
    document.getElementById("salonMap");

    function updateMap(){

        const street =
        streetInput.value.trim();

        const city =
        cityInput.value.trim();

        if(street || city){

            const fullAddress =
            `${street}, ${city}`;

            salonMap.src =
            `https://www.google.com/maps?q=${encodeURIComponent(fullAddress)}&output=embed`;

        }

    }

    streetInput.addEventListener("input", updateMap);

    cityInput.addEventListener("input", updateMap);

});

</script>

</body>
</html>
