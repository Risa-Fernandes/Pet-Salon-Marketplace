<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PawSalon Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

@import url('https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Urbanist',sans-serif;
}

:root{
    --primary:#6366f1;
    --secondary:#8b5cf6;
    --pink:#ec4899;
    --cyan:#06b6d4;
    --orange:#f59e0b;
    --green:#10b981;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    color:#1f2937;

    background:
    radial-gradient(circle at top left,#bfdbfe 0%,transparent 25%),
    radial-gradient(circle at top right,#fbcfe8 0%,transparent 25%),
    radial-gradient(circle at bottom right,#c4b5fd 0%,transparent 25%),
    linear-gradient(135deg,#eef2ff,#f8fafc,#fdf4ff);

    position:relative;
}

/* FLOATING BLOBS */

body::before{
    content:'';
    position:fixed;
    width:550px;
    height:550px;
    border-radius:50%;
    background:linear-gradient(135deg,#60a5fa,#818cf8,#ec4899);
    top:-180px;
    left:-120px;
    filter:blur(120px);
    opacity:0.35;
    animation:floatBlob1 10s infinite alternate ease-in-out;
    z-index:-2;
}

body::after{
    content:'';
    position:fixed;
    width:500px;
    height:500px;
    border-radius:50%;
    background:linear-gradient(135deg,#06b6d4,#14b8a6,#8b5cf6);
    bottom:-180px;
    right:-120px;
    filter:blur(120px);
    opacity:0.35;
    animation:floatBlob2 12s infinite alternate ease-in-out;
    z-index:-2;
}

@keyframes floatBlob1{
    0%{
        transform:translateY(0px) translateX(0px);
    }
    100%{
        transform:translateY(60px) translateX(40px);
    }
}

@keyframes floatBlob2{
    0%{
        transform:translateY(0px) translateX(0px);
    }
    100%{
        transform:translateY(-50px) translateX(-50px);
    }
}

/* FLOATING CIRCLES */

.bg-circle{
    position:fixed;
    border-radius:50%;
    z-index:-1;
    opacity:0.45;
    animation:floatCircle linear infinite;
}

.circle1{
    width:120px;
    height:120px;
    background:rgba(255,255,255,0.4);
    top:12%;
    left:45%;
    animation-duration:18s;
}

.circle2{
    width:80px;
    height:80px;
    background:rgba(255,255,255,0.4);
    bottom:20%;
    left:18%;
    animation-duration:15s;
}

.circle3{
    width:150px;
    height:150px;
    background:rgba(255,255,255,0.3);
    top:65%;
    right:15%;
    animation-duration:20s;
}

@keyframes floatCircle{
    0%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-30px);
    }
    100%{
        transform:translateY(0px);
    }
}

/* WRAPPER */

.wrapper{
    display:flex;
    min-height:100vh;
}

/* SIDEBAR */

.sidebar{
    width:300px;

    background:rgba(255,255,255,0.35);

    backdrop-filter:blur(30px);
    -webkit-backdrop-filter:blur(30px);

    border-right:1px solid rgba(255,255,255,0.25);

    padding:30px 22px;

    display:flex;
    flex-direction:column;
    justify-content:space-between;

    box-shadow:
    0 8px 32px rgba(31,38,135,0.12);

    position:relative;
}

/* LOGO */

.logo{
    font-size:38px;
    font-weight:800;
    margin-bottom:55px;

    background:linear-gradient(90deg,#2563eb,#7c3aed,#ec4899);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* LINKS */

.side-link{
    display:flex;
    align-items:center;
    gap:15px;

    text-decoration:none;

    padding:17px 18px;

    margin-bottom:16px;

    border-radius:24px;

    color:#475569;

    font-weight:700;

    background:rgba(255,255,255,0.4);

    transition:0.4s;

    position:relative;

    overflow:hidden;
}

.side-link::before{
    content:'';
    position:absolute;
    inset:0;

    background:
    linear-gradient(135deg,#38bdf8,#818cf8,#ec4899);

    opacity:0;

    transition:0.4s;

    z-index:-1;
}

.side-link:hover::before{
    opacity:1;
}

.side-link:hover{
    color:white;

    transform:
    translateX(8px)
    scale(1.02);

    box-shadow:
    0 0 20px rgba(59,130,246,0.35),
    0 0 40px rgba(236,72,153,0.15);
}

/* PROFILE */

.owner-profile{
    background:rgba(255,255,255,0.28);

    backdrop-filter:blur(24px);

    border-radius:32px;

    padding:22px;

    border:1px solid rgba(255,255,255,0.25);

    box-shadow:
    0 20px 40px rgba(99,102,241,0.08);
}

.profile-top{
    display:flex;
    align-items:center;
    gap:16px;
}

.avatar{
    width:72px;
    height:72px;

    border-radius:24px;

    background:
    linear-gradient(135deg,#38bdf8,#6366f1,#ec4899);

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

    font-size:28px;

    animation:avatarBounce 3s infinite ease-in-out;

    box-shadow:
    0 18px 30px rgba(99,102,241,0.25);
}

@keyframes avatarBounce{
    0%,100%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-8px);
    }
}

.owner-profile h5{
    margin:0;
    font-size:18px;
    font-weight:800;
}

.owner-profile p{
    margin:0;
    font-size:13px;
    color:#64748b;
}

/* LOGOUT */

.logout-btn{
    display:block;

    margin-top:20px;

    text-align:center;

    text-decoration:none;

    padding:14px;

    border-radius:20px;

    background:
    linear-gradient(135deg,#f43f5e,#fb7185);

    color:white;

    font-weight:700;

    transition:0.4s;

    box-shadow:
    0 15px 30px rgba(244,63,94,0.2);
}

.logout-btn:hover{
    transform:translateY(-5px);
    color:white;
}

/* MAIN */

.main{
    flex:1;
    padding:35px;
}

/* HEADER */

.header{
    background:rgba(255,255,255,0.32);

    backdrop-filter:blur(24px);

    border-radius:42px;

    padding:42px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:35px;

    border:1px solid rgba(255,255,255,0.3);

    box-shadow:
    0 20px 45px rgba(99,102,241,0.08);

    position:relative;

    overflow:hidden;
}

.header::before{
    content:'';

    position:absolute;

    width:280px;
    height:280px;

    background:
    linear-gradient(135deg,#38bdf8,#818cf8);

    border-radius:50%;

    opacity:0.12;

    top:-120px;
    right:-80px;
}

.header h1{
    font-size:52px;

    font-weight:800;

    margin-bottom:10px;

    background:
    linear-gradient(90deg,#2563eb,#7c3aed,#ec4899);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* GRID */

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(360px,1fr));
    gap:32px;
}

/* CARD */

.card-salon{
    background:rgba(255,255,255,0.38);

    backdrop-filter:blur(24px);

    border:1px solid rgba(255,255,255,0.25);

    border-radius:38px;

    overflow:hidden;

    position:relative;

    transition:0.5s ease;

    box-shadow:
    0 10px 40px rgba(99,102,241,0.10);

    animation:floatCard 5s ease-in-out infinite;
}

.card-salon::after{
    content:'';

    position:absolute;

    top:-120%;
    left:-40%;

    width:70%;
    height:300%;

    background:rgba(255,255,255,0.18);

    transform:rotate(25deg);

    transition:0.8s;
}

.card-salon:hover::after{
    left:120%;
}

.card-salon:hover{
    transform:
    translateY(-14px)
    scale(1.02);

    box-shadow:
    0 25px 60px rgba(99,102,241,0.18);
}

@keyframes floatCard{
    0%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-6px);
    }
    100%{
        transform:translateY(0px);
    }
}

.card-salon img{
    width:100%;
    height:auto;
    max-height:240px;
}

.card-salon:hover img{
    transform:scale(1.08);
}

/* CARD BODY */

.card-body{
    padding:26px;
}

.card-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
}

.card-top h4{
    font-size:27px;
    font-weight:800;
}

/* INFO */

.info{
    display:flex;
    align-items:center;
    gap:12px;

    color:#475569;

    margin-bottom:13px;

    font-size:14px;

    font-weight:600;
}

/* TAGLINE */

.tagline{
    margin-top:16px;

    padding:14px 16px;

    border-radius:22px;

    background:
    linear-gradient(135deg,#eff6ff,#f5f3ff,#fdf2f8);

    color:#475569;

    font-size:13px;

    font-weight:700;
}

/* BUTTON GROUP */

.custom-btn-group{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
    margin-top:25px;
}

/* BUTTONS */

.action-btn{
    border:none;

    text-decoration:none;

    padding:15px;

    border-radius:22px;

    color:white;

    font-size:14px;

    font-weight:700;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:0.35s;

    position:relative;

    overflow:hidden;

    letter-spacing:0.3px;

    cursor:pointer;
}

.action-btn::before{
    content:'';

    position:absolute;

    width:100%;
    height:100%;

    background:rgba(255,255,255,0.18);

    top:-100%;
    left:0;

    transition:0.4s;
}

.action-btn:hover::before{
    top:0;
}

.action-btn:hover{
    transform:
    translateY(-5px)
    scale(1.03);

    color:white;
}

.view{
    background:
    linear-gradient(135deg,#3b82f6,#2563eb);
}

.edit{
    background:
    linear-gradient(135deg,#10b981,#059669);
}

.delete{
    background:
    linear-gradient(135deg,#f43f5e,#e11d48);
}

.app{
    background:
    linear-gradient(135deg,#f59e0b,#ea580c);
}

.analytics{
    background:
    linear-gradient(135deg,#8b5cf6,#7c3aed,#d946ef);

    grid-column:span 2;
}

/* RESPONSIVE */

@media(max-width:950px){

    .wrapper{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
    }

    .header h1{
        font-size:38px;
    }

}

@media(max-width:500px){

    .main{
        padding:20px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .custom-btn-group{
        grid-template-columns:1fr;
    }

    .analytics{
        grid-column:span 1;
    }

}

</style>

</head>

<body>

<div class="bg-circle circle1"></div>
<div class="bg-circle circle2"></div>
<div class="bg-circle circle3"></div>

<div class="wrapper">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <div>

            <div class="logo">
                <i class="fas fa-paw"></i> PawSalon
            </div>

            <a href="/salon/dashbord" class="side-link">
                <i class="fas fa-house"></i>
                Dashboard
            </a>

            <a href="/manage-salon" class="side-link">
                <i class="fas fa-plus"></i>
                Add Salon
            </a>

        </div>

        <!-- PROFILE -->

        <div class="owner-profile">

            <div class="profile-top">

                <div class="avatar">
                    <i class="fas fa-user"></i>
                </div>

                <div>
                    <h5 id="ownerName">Loading...</h5>
                    <p id="ownerEmail">Please wait...</p>
                </div>

            </div>

            <a href="/logout" class="logout-btn">
                <i class="fas fa-right-from-bracket me-2"></i>
                Logout
            </a>

        </div>

    </div>

    <!-- MAIN -->

    <div class="main">

        <div class="header">
            <h1>My Salons ✨</h1>
        </div>

        <div id="salonResults" class="grid"></div>

    </div>

</div>

<script>

let allSalons = [];

function renderSalons(salons){

    const box = document.getElementById("salonResults");
    box.innerHTML = "";

    salons.forEach(salon => {

        box.innerHTML += `

        <div class="card-salon">

            <img src="http://127.0.0.1:5000/static/${salon.image}">

            <div class="card-body">

                <div class="card-top">
                    <h4>${salon.name}</h4>
                </div>

                <p class="info">
                    <i class="fas fa-location-dot text-danger"></i>
                    ${salon.city}
                </p>

                <p class="info">
                    <i class="fas fa-clock text-success"></i>
                    ${salon.open_hours} - ${salon.close_hours}
                </p>

                <div class="tagline">
                    ${salon.tagline || "Premium Pet Grooming Salon"}
                </div>

                <div class="custom-btn-group">

                    <a href="/salon-detail?id=${salon.id}" class="action-btn view">
                        <i class="fas fa-eye me-2"></i>
                        View
                    </a>

                    <a href="/editsalon?id=${salon.id}" class="action-btn edit">
                        <i class="fas fa-pen me-2"></i>
                        Edit
                    </a>

                    <button onclick="deleteSalon(${salon.id})" class="action-btn delete">
                        <i class="fas fa-trash me-2"></i>
                        Delete
                    </button>

                    <button onclick="location.href='/salon-appointments/${salon.id}'" class="action-btn app">
                        <i class="fas fa-calendar me-2"></i>
                        Appointments
                    </button>

                    <a href="/analytics?salon_id=${salon.id}" class="action-btn analytics">
                        <i class="fas fa-chart-line me-2"></i>
                        Analytics
                    </a>

                </div>

            </div>

        </div>

        `;
    });
}

function deleteSalon(id){

    if(!confirm("Delete salon?")) return;

    fetch(`http://127.0.0.1:5000/api/salon/${id}`,{
        method:"DELETE"
    })
    .then(res=>res.json())
    .then(()=>{
        allSalons = allSalons.filter(s=>s.id!==id);
        renderSalons(allSalons);
        alert("Deleted");
    });
}

fetch("http://127.0.0.1:5000/api/salons")
.then(res=>res.json())
.then(data=>{
    allSalons = data;
    renderSalons(data);
});

fetch("http://127.0.0.1:5000/api/current-owner")
.then(res=>res.json())
.then(user=>{
    document.getElementById("ownerName").innerText = user.name;
    document.getElementById("ownerEmail").innerText = user.email;
});

</script>

</body>
</html>
