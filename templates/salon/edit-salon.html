<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PawSalon | Edit Salon</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Font Awesome -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>

@import url('https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800&display=swap');

:root{
    --primary:#6366f1;
    --secondary:#8b5cf6;
    --pink:#ec4899;
    --cyan:#06b6d4;
    --orange:#f59e0b;
    --green:#10b981;
    --dark:#1f2937;
    --light:#f8fafc;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Urbanist',sans-serif;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    color:var(--dark);

    background:
    radial-gradient(circle at top left,#bfdbfe 0%,transparent 25%),
    radial-gradient(circle at top right,#fbcfe8 0%,transparent 25%),
    radial-gradient(circle at bottom right,#c4b5fd 0%,transparent 25%),
    linear-gradient(135deg,#eef2ff,#f8fafc,#fdf4ff);

    position:relative;
}

/* FLOATING BACKGROUND */

body::before{
    content:'';
    position:fixed;
    width:500px;
    height:500px;
    border-radius:50%;
    background:linear-gradient(135deg,#60a5fa,#818cf8,#ec4899);
    top:-180px;
    left:-100px;
    filter:blur(120px);
    opacity:.30;
    z-index:-2;
}

body::after{
    content:'';
    position:fixed;
    width:500px;
    height:500px;
    border-radius:50%;
    background:linear-gradient(135deg,#06b6d4,#14b8a6,#8b5cf6);
    bottom:-180px;
    right:-100px;
    filter:blur(120px);
    opacity:.30;
    z-index:-2;
}

/* NAVBAR */

.navbar{
    margin-top:20px;
    padding:18px 30px;

    background:rgba(255,255,255,0.45);

    backdrop-filter:blur(20px);

    border-radius:40px;

    width:92%;

    left:50%;

    transform:translateX(-50%);

    border:1px solid rgba(255,255,255,0.25);

    box-shadow:
    0 20px 45px rgba(99,102,241,0.08);
}

.navbar-brand{
    font-size:34px;
    font-weight:800;

    background:linear-gradient(90deg,#2563eb,#7c3aed,#ec4899);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* BUTTONS */

.btn-owner{
    background:
    linear-gradient(135deg,#6366f1,#8b5cf6,#ec4899);

    border:none;
    color:white!important;

    padding:11px 25px;

    border-radius:18px;

    font-weight:700;

    transition:.3s;

    box-shadow:
    0 15px 30px rgba(99,102,241,.20);
}

.btn-owner:hover{
    transform:translateY(-3px);
}

.btn-login{
    border-radius:18px;
    padding:10px 24px;
    font-weight:700;
}

.btn-login:hover{
    border-color:#8b5cf6;
    color:#8b5cf6;
}

/* MAIN CARD */

.main-card{
    background:rgba(255,255,255,0.55);

    backdrop-filter:blur(24px);

    border-radius:35px;

    padding:35px;

    border:1px solid rgba(255,255,255,.25);

    box-shadow:
    0 20px 45px rgba(99,102,241,.08);
}

/* FORM SECTIONS */

.form-section{
    background:rgba(255,255,255,.90);

    border-radius:28px;

    padding:30px;

    margin-bottom:30px;

    border:1px solid rgba(255,255,255,.4);

    box-shadow:
    0 10px 30px rgba(0,0,0,.06);
}

/* TITLES */

.section-title{
    font-size:25px;
    font-weight:800;

    margin-bottom:25px;

    display:flex;
    align-items:center;
    gap:12px;

    background:
    linear-gradient(90deg,#2563eb,#7c3aed,#ec4899);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* LABEL */

.form-label{
    font-weight:700;
    margin-bottom:8px;
    color:#374151;
}

/* INPUTS */

.form-control{
    border:none!important;

    background:#f5f7fb!important;

    border-radius:16px!important;

    padding:14px 18px!important;

    min-height:54px;

    box-shadow:none!important;

    transition:.3s;
}

.form-control:focus{
    background:white!important;

    border:2px solid #8b5cf6!important;

    box-shadow:none!important;
}

/* SERVICES TABLE */

.services-table{
    width:100%;
    border-collapse:separate;
    border-spacing:0 15px;
}

.services-table thead th{
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    color:white;
    padding:16px;
    font-size:15px;
    border:none;
}

.services-table thead th:first-child{
    border-radius:16px 0 0 16px;
}

.services-table thead th:last-child{
    border-radius:0 16px 16px 0;
}

.services-table tbody tr{
    background:#f8fafc;
    transition:.3s;
}

.services-table tbody tr:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(0,0,0,.05);
}

.services-table td{
    padding:14px;
    vertical-align:middle;
    border:none;
}

.services-table tbody tr td:first-child{
    border-radius:16px 0 0 16px;
}

.services-table tbody tr td:last-child{
    border-radius:0 16px 16px 0;
}

/* REMOVE BUTTON */

.remove-btn{
    width:42px;
    height:42px;
    border:none;
    border-radius:12px;

    background:linear-gradient(135deg,#ef4444,#f43f5e);

    color:white;

    transition:.3s;
}

.remove-btn:hover{
    transform:scale(1.08);
}

/* UPDATE BUTTON */

.btn-update{
    background:
    linear-gradient(135deg,#6366f1,#8b5cf6,#ec4899);

    border:none;

    color:white;

    padding:15px 45px;

    border-radius:20px;

    font-size:18px;

    font-weight:700;

    transition:.4s;

    box-shadow:
    0 15px 30px rgba(99,102,241,.2);
}

.btn-update:hover{
    transform:
    translateY(-4px)
    scale(1.02);

    color:white;
}

/* RESPONSIVE */

@media(max-width:991px){

    .navbar{
        width:96%;
    }

    .services-table{
        min-width:800px;
    }

    .table-responsive{
        overflow-x:auto;
    }

}

</style>
</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg position-relative">

    <div class="container-fluid">

        <a class="navbar-brand" href="/">
            <i class="fas fa-paw"></i> PawSalon
        </a>

        <div class="ms-auto d-flex align-items-center">

                    <a href="/adminviewsalon"
               class="btn btn-owner">
                <i class="fas fa-house me-2"></i>Home
            </a>

        </div>

    </div>

</nav>

<!-- MAIN -->

<div class="container my-5">

<div class="main-card">

<div class="d-flex justify-content-between align-items-center flex-wrap mb-4">

    <div>
        <h2 class="fw-bold mb-1">
            Edit Salon Details
        </h2>

        <p class="text-muted mb-0">
            Update salon information & services ✨
        </p>
    </div>

    <button type="button"
            class="btn btn-outline-dark rounded-pill px-4"
            onclick="history.back()">
        Cancel
    </button>

</div>

<form id="editForm">

<input type="hidden" id="salon_id">

<!-- BASIC INFO -->
<div class="row g-4 mb-4">

    <!-- BASIC INFO -->
    <div class="col-lg-6">
        <div class="form-section h-100">

            <h4 class="section-title">
                <i class="fas fa-store"></i>
                Basic Information
            </h4>

            <div class="row g-3">

                <div class="col-12">
                    <label class="form-label">Salon Name</label>
                    <input type="text" id="salon_name"
                           class="form-control">
                </div>

                <div class="col-12">
                    <label class="form-label">Gov Number</label>
                    <input type="text" id="gov_number"
                           class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Open Time</label>
                    <input type="time" id="open_hours"
                           class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Close Time</label>
                    <input type="time" id="close_hours"
                           class="form-control">
                </div>

                <div class="col-12">
                    <label class="form-label">Tagline</label>
                    <input type="text" id="tagline"
                           class="form-control">
                </div>

                <div class="col-12">
                    <label class="form-label">Description</label>
                    <textarea id="description"
                              rows="5"
                              class="form-control"></textarea>
                </div>

            </div>

        </div>
    </div>

    <!-- LOCATION -->
    <div class="col-lg-6">
        <div class="form-section h-100">

            <h4 class="section-title">
                <i class="fas fa-map-marker-alt"></i>
                Location Details
            </h4>

            <div class="row g-3">

                <div class="col-12">
                    <label class="form-label">Street</label>
                    <input type="text" id="street"
                           class="form-control">
                </div>

                <div class="col-12">
                    <label class="form-label">City</label>
                    <input type="text" id="city"
                           class="form-control">
                </div>

                <div class="col-12">
                    <label class="form-label">Phone</label>
                    <input type="text" id="phone"
                           class="form-control">
                </div>

            </div>

        </div>
    </div>

</div>

<!-- SERVICES -->

<div class="form-section">

<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap">

<h4 class="section-title mb-0">
    <i class="fas fa-scissors"></i>
    Salon Services
</h4>

<button type="button"
        id="addServiceBtn"
        class="btn btn-owner">

    <i class="fas fa-plus me-2"></i>
    Add Service

</button>

</div>

<div class="table-responsive">

<table class="services-table">

<thead>
<tr>
    <th style="width:40%">Service Name</th>
    <th style="width:25%">Price</th>
    <th style="width:25%">Duration</th>
    <th style="width:10%">Action</th>
</tr>
</thead>

<tbody id="servicesContainer">

</tbody>

</table>

</div>

</div>

<!-- BUTTON -->

<div class="text-center mt-4">

<button class="btn-update"
        type="submit">

    <i class="fas fa-check-circle me-2"></i>
    Update Salon

</button>

</div>

</form>

</div>
</div>

<!-- SCRIPT -->

<script>

const urlParams = new URLSearchParams(window.location.search);
const salonId = urlParams.get("id");

const servicesContainer = document.getElementById("servicesContainer");

// LOAD SALON

if(salonId){

fetch(`http://127.0.0.1:5000/api/salon/${salonId}`)
.then(res => res.json())
.then(data => {

    salon_name.value = data.name || "";
    gov_number.value = data.gov_number || "";
    open_hours.value = data.open_hours || "";
    close_hours.value = data.close_hours || "";
    tagline.value = data.tagline || "";
    description.value = data.description || "";
    street.value = data.address || "";
    city.value = data.city || "";
    phone.value = data.phone || "";

    servicesContainer.innerHTML = "";

    if(data.services && data.services.length > 0){

        data.services.forEach(service => {
            addServiceRow(service);
        });

    }

});

}

// ADD SERVICE ROW

function addServiceRow(service = {}){

const tr = document.createElement("tr");

tr.innerHTML = `

<td>
    <input type="text"
           class="form-control service-name"
           value="${service.service_name || ''}"
           placeholder="Service Name">
</td>

<td>
    <input type="number"
           class="form-control service-price"
           value="${service.price || ''}"
           placeholder="Price">
</td>

<td>
    <input type="number"
           class="form-control service-duration"
           value="${service.duration || ''}"
           placeholder="Duration (min)">
</td>

<td class="text-center">
    <button type="button"
            class="remove-btn"
            onclick="this.closest('tr').remove()">

        <i class="fas fa-trash"></i>

    </button>
</td>

`;

servicesContainer.appendChild(tr);

}

// ADD BUTTON

document.getElementById("addServiceBtn")
.addEventListener("click", () => {

    addServiceRow();

});

// UPDATE SALON

document.getElementById("editForm")
.addEventListener("submit", function(e){

e.preventDefault();

const formData = new FormData();

formData.append("name", salon_name.value);
formData.append("gov_number", gov_number.value);
formData.append("open_hours", open_hours.value);
formData.append("close_hours", close_hours.value);
formData.append("tagline", tagline.value);
formData.append("description", description.value);
formData.append("address", street.value);
formData.append("city", city.value);
formData.append("phone", phone.value);

// SERVICES

const services = [];

document.querySelectorAll("#servicesContainer tr")
.forEach(row => {

services.push({

    service_name:
    row.querySelector(".service-name").value,

    price:
    row.querySelector(".service-price").value,

    duration:
    row.querySelector(".service-duration").value

});

});

formData.append("services", JSON.stringify(services));

// API

fetch(`http://127.0.0.1:5000/api/salon/${salonId}`, {

method:"PUT",
body:formData

})

.then(res => res.json())

.then(data => {

alert("Salon updated successfully ✅");

window.location.href = "/adminviewsalon";

})

.catch(err => {

console.error(err);

alert("Update failed ❌");

});

});

</script>
</body>
</html>
