<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate Salon | PawSalon</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#fff7f7,#f0fff4,#eefcff);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card-box{
    width:100%;
    max-width:550px;
    background:white;
    border-radius:30px;
    overflow:hidden;
    box-shadow:0 10px 35px rgba(0,0,0,0.08);
}

.top{
    background:linear-gradient(135deg,#ff6b6b,#ff9f43);
    color:white;
    text-align:center;
    padding:35px;
}

.top-icon{
    width:80px;
    height:80px;
    background:white;
    color:#f59e0b;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
    margin:auto;
    margin-bottom:15px;
}

.top h2{
    font-weight:700;
    margin-bottom:8px;
}

.body-box{
    padding:35px;
}

.star-rating{
    text-align:center;
    margin:20px 0;
}

.star-rating input{
    display:none;
}

.star-rating label{
    font-size:45px;
    color:#ddd;
    cursor:pointer;
    transition:0.3s;
    margin:0 3px;
}

textarea{
    resize:none;
    border-radius:15px !important;
    padding:15px !important;
}

.submit-btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:30px;
    background:#ff6b6b;
    color:white;
    font-weight:600;
    margin-top:20px;
    transition:0.3s;
}

.submit-btn:hover{
    background:#ff5252;
}

.rating-text{
    text-align:center;
    font-weight:600;
    color:#666;
    margin-bottom:15px;
}
</style>
</head>

<body>

<div class="card-box">

    <div class="top">
        <div class="top-icon">
            <i class="fas fa-star"></i>
        </div>
        <h2>Rate Your Salon ⭐</h2>
        <p>Share your grooming experience</p>
    </div>

    <div class="body-box">

        <form action="/submit-rating" method="POST">

            <input type="hidden" name="salon_id" value="{{ salon.id }}">

            <div class="star-rating">

                <input type="radio" name="rating" value="1" id="star1">
                <label for="star1">★</label>

                <input type="radio" name="rating" value="2" id="star2">
                <label for="star2">★</label>

                <input type="radio" name="rating" value="3" id="star3">
                <label for="star3">★</label>

                <input type="radio" name="rating" value="4" id="star4">
                <label for="star4">★</label>

                <input type="radio" name="rating" value="5" id="star5">
                <label for="star5">★</label>

            </div>

            <p class="rating-text" id="ratingText">Select rating</p>

            <textarea name="review" class="form-control" rows="4"
            placeholder="Write your feedback..."></textarea>

            <button type="submit" class="submit-btn">
                Submit Rating
            </button>

        </form>

    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const labels = document.querySelectorAll('.star-rating label');
    const inputs = document.querySelectorAll('.star-rating input');
    const ratingText = document.getElementById('ratingText');

    labels.forEach((label, index) => {

        label.addEventListener('click', function () {

            inputs[index].checked = true;

            labels.forEach((star, i) => {
                if(i <= index){
                    star.style.color = "#fbbf24";
                    star.style.transform = "scale(1.15)";
                } else {
                    star.style.color = "#ddd";
                    star.style.transform = "scale(1)";
                }
            });

            ratingText.innerText = (index + 1) + " Star Selected";
        });

    });

});
</script>
</body>
</html>
