<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Forgot Password - PawFect Care</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>

@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap');

:root {
    --primary: #ff6b6b;
    --secondary: #4ecdc4;
    --dark: #2d3436;
    --glass: rgba(255,255,255,0.92);
}

/* =========================
BACKGROUND
========================= */

body {

    font-family: 'Open Sans', sans-serif;

    background:
    linear-gradient(-45deg,
    #ff6ec4,
    #7873f5,
    #43cea2,
    #ff9a9e);

    background-size: 400% 400%;

    animation: gradientMove 10s ease infinite;

    overflow-x: hidden;

    min-height: 100vh;
}

@keyframes gradientMove {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}

/* =========================
PAW BACKGROUND
========================= */

.live-bg-wrapper {

    position: fixed;

    inset: 0;

    z-index: -1;

    overflow: hidden;
}

.paw-bubble {

    position: absolute;

    bottom: -300px;

    color: rgba(255,255,255,0.4);

    animation: floatUp linear infinite;
}

@keyframes floatUp {

    from {

        transform: translateY(0) scale(0.8);

        opacity: 0;
    }

    to {

        transform: translateY(-120vh) scale(1.4);

        opacity: 0.7;
    }
}

/* =========================
NAVBAR
========================= */

.navbar {

    position: fixed;

    top: 20px;

    left: 50%;

    transform: translateX(-50%);

    width: 90%;

    padding: 0.8rem 2rem;

    background: rgba(255,255,255,0.9);

    backdrop-filter: blur(15px);

    border-radius: 50px;

    box-shadow: 0 10px 30px rgba(0,0,0,0.2);

    z-index: 999;
}

.navbar-brand {

    font-weight: 700;

    color: var(--dark);

    font-family: 'Fredoka', sans-serif;

    font-size: 1.4rem;
}

/* =========================
CARD
========================= */

.main-wrapper {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding-top: 100px;
}

.glass-card {

    background: var(--glass);

    backdrop-filter: blur(18px);

    border-radius: 30px;

    padding: 40px;

    width: 100%;

    max-width: 480px;

    box-shadow: 0 25px 60px rgba(0,0,0,0.25);

    animation: fadeUp 1s ease;
}

@keyframes fadeUp {

    from {
        opacity: 0;
        transform: translateY(40px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.glass-card h2 {

    font-family: 'Fredoka', sans-serif;

    font-weight: 700;

    color: var(--dark);

    text-align: center;

    margin-bottom: 10px;
}

.glass-card p {

    text-align: center;

    color: #666;

    margin-bottom: 30px;
}

/* =========================
FORM
========================= */

.form-control {

    border-radius: 15px;

    padding: 14px;

    border: 1px solid #ddd;

    box-shadow: none;
}

.form-control:focus {

    border-color: var(--secondary);

    box-shadow: 0 0 0 0.2rem rgba(78,205,196,0.2);
}

.btn-reset {

    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 50px;

    font-weight: 700;

    font-size: 16px;

    background:
    linear-gradient(
    135deg,
    var(--primary),
    #ff8e8e);

    color: white;

    transition: 0.3s;
}

.btn-reset:hover {

    transform: translateY(-2px);

    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

/* =========================
MESSAGE BOX
========================= */

#message {

    margin-top: 20px;

    text-align: center;

    font-weight: 600;

    color: #198754;
}

#resetBox {

    margin-top: 25px;

    padding: 20px;

    border-radius: 18px;

    background: rgba(255,255,255,0.7);

    text-align: center;

    border: 1px solid rgba(255,255,255,0.5);
}

#resetBox p {

    margin-bottom: 10px;

    font-weight: 700;

    color: var(--dark);
}

#resetLink {

    display: block;

    word-break: break-all;

    color: #0d6efd;

    font-weight: 600;

    text-decoration: none;
}

#resetLink:hover {

    text-decoration: underline;
}

/* =========================
ICON
========================= */

.lock-icon {

    width: 90px;

    height: 90px;

    background: linear-gradient(
    135deg,
    var(--secondary),
    #43cea2);

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    margin: 0 auto 20px;

    box-shadow: 0 15px 35px rgba(0,0,0,0.2);
}

.lock-icon i {

    font-size: 2.5rem;

    color: white;
}

</style>

</head>

<body>

<!-- PAW BACKGROUND -->
<div class="live-bg-wrapper" id="paw-container"></div>

<!-- NAVBAR -->
<nav class="navbar">

    <div class="container-fluid">

        <a class="navbar-brand" href="/">
            <i class="fas fa-paw"></i>
            PawFect Care
        </a>

    </div>

</nav>

<!-- MAIN -->
<div class="container main-wrapper">

    <div class="glass-card">

        <div class="lock-icon">
            <i class="fas fa-key"></i>
        </div>

        <h2>Forgot Password?</h2>

        <p>
            Enter your registered email to generate
            a password reset link.
        </p>

        <form onsubmit="forgotPassword(event)">

            <div class="mb-3">

                <input
                type="email"
                id="email"
                class="form-control"
                placeholder="Enter your email"
                required>

            </div>

            <button
            type="submit"
            class="btn-reset">

                <i class="fas fa-paper-plane"></i>
                Generate Reset Link

            </button>

        </form>

        <p id="message"></p>

        <div id="resetBox" style="display:none;">

            <p>
                Password Reset Link
            </p>

            <a
            id="resetLink"
            href=""
            target="_blank"></a>

        </div>

    </div>

</div>

<script>

/* =========================
FORGOT PASSWORD
========================= */

async function forgotPassword(event) {

    event.preventDefault();

    const email =
    document.getElementById("email").value;

    const response =
    await fetch("/api/forgot_password", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            email: email
        })
    });

    const data = await response.json();

    document.getElementById("message")
    .innerText = data.message;

    // SHOW RESET LINK
    if (data.reset_link) {

        document.getElementById("resetBox")
        .style.display = "block";

        document.getElementById("resetLink")
        .href = data.reset_link;

        document.getElementById("resetLink")
        .innerText = data.reset_link;
    }
}

/* =========================
PAW BACKGROUND
========================= */

const container =
document.getElementById('paw-container');

function createPaw(){

    const paw =
    document.createElement('i');

    paw.className =
    'fas fa-paw paw-bubble';

    paw.style.left =
    Math.random() * 100 + 'vw';

    paw.style.fontSize =
    Math.random() * 40 + 20 + 'px';

    paw.style.animationDuration =
    Math.random() * 8 + 6 + 's';

    container.appendChild(paw);

    setTimeout(() => {
        paw.remove();
    }, 15000);
}

for(let i=0; i<30; i++){
    createPaw();
}

setInterval(createPaw, 3000);

</script>

</body>
</html>
