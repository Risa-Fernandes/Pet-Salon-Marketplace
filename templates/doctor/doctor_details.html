<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor Details - PawFect Care</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  
    .live-bg-wrapper {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            background: linear-gradient(180deg, #1e3c72 0%, #2a5298 100%);
            overflow: hidden;
        }

        /* Styling the Paw Bubbles */
        .paw-bubble {
            position: absolute;
            bottom: -100px;
            color: rgba(255, 255, 255, 0.4); 
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.3));
            cursor: pointer;
            transition: opacity 0.3s, transform 0.3s;
            animation: rise-and-spin linear infinite;
            pointer-events: auto; /* Allows hovering/clicking */
        }

        /* Animation for Floating */
        @keyframes rise-and-spin {
            0% { 
                transform: translateY(0) rotate(0deg) scale(0.8); 
                opacity: 0; 
            }
            10% { opacity: 0.8; }
            90% { opacity: 0.5; }
            100% { 
                transform: translateY(-120vh) rotate(30deg) scale(1.4); 
                opacity: 0; 
            }
        }

        /* Popping Effect Class */
        .popped {
            transform: scale(2) !important;
            opacity: 0 !important;
            pointer-events: none;
        }
        .pulse-animation {
        animation: shadow-pulse 2s infinite;
    }

    @keyframes shadow-pulse {
        0% { box-shadow: 0 0 0 0 rgba(78, 205, 196, 0.4); }
        70% { box-shadow: 0 0 0 15px rgba(78, 205, 196, 0); }
        100% { box-shadow: 0 0 0 0 rgba(78, 205, 196, 0); }
    }
    
    .navbar {
        margin-top: 20px; /* Makes it look like it's floating */
        padding: 0.8rem 2rem;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(15px);
        border-radius: 50px; /* Pill shape */
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        width: 90%;
        left: 50%;
        transform: translateX(-50%);
        transition: all 0.4s ease;
    }

    /* Navbar links hover effect */
    .nav-link {
        color: var(--dark-text) !important;
        font-weight: 600;
        margin: 0 10px;
        position: relative;
        transition: color 0.3s;
    }

    .nav-link::after {
        content: '';
        position: absolute;
        width: 0;
        height: 2px;
        bottom: 0;
        left: 0;
        background-color: var(--primary-color);
        transition: width 0.3s;
    }

    .nav-link:hover::after {
        width: 100%;
    }

    .nav-link:hover {
        color: var(--primary-color) !important;
    }
    .navbar-brand { font-weight: bold; color: #42289e; }
  .navbar-brand { font-weight: bold; color: #1c2f83; }
  .hero-card { background: #212b83; color: white; border-radius: 15px; padding: 30px; margin-bottom: 30px; text-align: center; }
  .ai-bot { position: fixed; bottom: 30px; right: 30px; background: #2f1f75; color: #fff; border-radius: 50%; width: 60px; height: 60px; display:flex; align-items:center; justify-content:center; font-size:1.5rem; cursor:pointer; box-shadow: 0 0 10px rgba(0,0,0,0.2); }
</style>
</head>
<body>

<!-- Navbar -->
 <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="/salon/dashbord">
            <span style="color: var(--primary-color);"><i class="fas fa-paw"></i> Paw</span><span style="color: var(--bg-top);">Doctor</span>
        </a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item"><a class="nav-link" href="/doctor_home">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="">Browse Doctors</a></li>
            
            </ul>
            
            <div class="d-flex align-items-center">
                <a href="/login" class="btn btn-login me-2">Login</a>
                <a href="/register" class="btn btn-login me-2">Register</a>
                <a href="" class="btn btn-owner pulse-animation">
                    <i class="fas fa-store me-2"></i>Manage Doctors
                </a>
            </div>
        </div>
    </div>
</nav>

<!-- Hero Card -->
<div class="container mt-4">
  <div class="hero-card shadow-sm">
    <h1>Doctor Details</h1>
    <p>Full information about the veterinarian.</p>
  </div>
</div>

<!-- Doctor Info -->
<div class="container mb-5">
  <a href="doctor_list.html" class="btn btn-secondary mb-3"><i class="fas fa-arrow-left"></i> Back</a>
  <div class="row g-3">
    <div class="col-md-4">
      <img src="doctor1.jpg" class="img-fluid rounded" alt="Doctor">
    </div>
    <div class="col-md-8">
      <h3>Dr. Sarah Smith</h3>
      <p><strong>Specialization:</strong> Veterinary Surgeon</p>
      <p><strong>Experience:</strong> 8 years</p>
      <p><strong>Available:</strong> Mon, Wed, Fri | 10:00 AM - 5:00 PM</p>
      <p><strong>Consultation Fee:</strong> ₹500</p>
      <a href="/book-appointment/{{ doctor.id }}" class="btn btn-primary mt-2"><i class="fas fa-calendar-check"></i> Book Appointment</a>
    </div>
  </div>
</div>

<!-- AI Bot -->
<div class="ai-bot"><i class="fas fa-robot"></i></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>

        const container = document.getElementById('paw-container');
        const pawCount = 40; 

        function createPaw() {
            const pawWrapper = document.createElement('div');
            pawWrapper.className = 'paw-bubble';
            
            const icon = document.createElement('i');
            icon.className = 'fas fa-paw';
            
            // Randomize icon size
            const size = Math.random() * 45 + 20 + 'px';
            icon.style.fontSize = size;
            
            // Randomize position and animation timing
            pawWrapper.style.left = Math.random() * 100 + 'vw';
            pawWrapper.style.animationDuration = Math.random() * 8 + 7 + 's';
            pawWrapper.style.animationDelay = Math.random() * 5 + 's';
            
            // POP INTERACTION: When mouse enters, bubble "pops"
            pawWrapper.addEventListener('mouseenter', function() {
                this.classList.add('popped');
                // Replace the popped bubble after 2 seconds
                setTimeout(() => {
                    this.remove();
                    spawnOne();
                }, 1000);
            });

            pawWrapper.appendChild(icon);
            container.appendChild(pawWrapper);
        }

        function spawnOne() {
            createPaw();
        }

        // Initial spawn
        for (let i = 0; i < pawCount; i++) {
            createPaw();
        }
</script>

</body>
</html>
