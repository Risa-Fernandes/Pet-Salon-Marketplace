<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Reset Password - PawFect Care</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap');

        :root {
            --primary: #ff6b6b;
            --secondary: #4ecdc4;
            --dark: #2d3436;
            --glass: rgba(255,255,255,0.92);
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Open Sans', sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;

            background: linear-gradient(-45deg,
                #ff6ec4,
                #7873f5,
                #43cea2,
                #ff9a9e);

            background-size:400% 400%;
            animation:gradientMove 10s ease infinite;
        }

        @keyframes gradientMove {

            0%{
                background-position:0% 50%;
            }

            50%{
                background-position:100% 50%;
            }

            100%{
                background-position:0% 50%;
            }
        }

        /* ---------- FLOATING PAWS ---------- */

        .live-bg-wrapper{
            position:fixed;
            inset:0;
            overflow:hidden;
            z-index:-1;
        }

        .paw-bubble{
            position:absolute;
            bottom:-120px;
            color:rgba(255,255,255,0.3);
            animation:floatUp linear infinite;
        }

        @keyframes floatUp {

            from{
                transform:translateY(0) scale(0.8);
                opacity:0;
            }

            to{
                transform:translateY(-120vh) scale(1.4);
                opacity:0.7;
            }
        }

        /* ---------- CARD ---------- */

        .reset-card{
            width:100%;
            max-width:450px;

            background:var(--glass);
            backdrop-filter:blur(15px);

            padding:40px;
            border-radius:28px;

            box-shadow:0 25px 60px rgba(0,0,0,0.25);

            animation:fadeUp 0.8s ease;
        }

        @keyframes fadeUp{

            from{
                opacity:0;
                transform:translateY(40px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .brand-logo{
            width:90px;
            height:90px;

            background:linear-gradient(135deg,
                var(--primary),
                #ff8e8e);

            display:flex;
            align-items:center;
            justify-content:center;

            margin:0 auto 20px;

            border-radius:50%;

            box-shadow:0 10px 25px rgba(255,107,107,0.4);
        }

        .brand-logo i{
            font-size:2.8rem;
            color:white;
        }

        h2{
            text-align:center;
            font-family:'Fredoka', sans-serif;
            font-size:2.2rem;
            margin-bottom:10px;
            color:var(--dark);
        }

        .subtitle{
            text-align:center;
            color:#666;
            margin-bottom:30px;
            font-size:15px;
        }

        /* ---------- INPUT ---------- */

        .input-group-custom{
            position:relative;
            margin-bottom:22px;
        }

        .input-group-custom i{
            position:absolute;
            top:50%;
            left:18px;
            transform:translateY(-50%);
            color:#888;
            font-size:15px;
        }

        .form-control-custom{
            width:100%;
            padding:14px 14px 14px 48px;

            border:none;
            outline:none;

            border-radius:15px;

            background:white;

            font-size:15px;

            box-shadow:0 6px 18px rgba(0,0,0,0.08);

            transition:0.3s ease;
        }

        .form-control-custom:focus{
            transform:translateY(-2px);
            box-shadow:0 10px 25px rgba(0,0,0,0.12);
        }

        /* ---------- BUTTON ---------- */

        .reset-btn{
            width:100%;
            padding:14px;

            border:none;
            border-radius:50px;

            background:linear-gradient(135deg,
                var(--primary),
                #ff8e8e);

            color:white;
            font-size:16px;
            font-weight:700;

            cursor:pointer;

            transition:0.3s ease;

            box-shadow:0 10px 25px rgba(255,107,107,0.35);
        }

        .reset-btn:hover{
            transform:translateY(-3px) scale(1.01);
        }

        /* ---------- MESSAGE ---------- */

        .message{
            margin-top:22px;
            padding:14px;
            border-radius:14px;
            text-align:center;
            font-weight:600;
            display:none;
        }

        .success{
            background:#d4edda;
            color:#155724;
            display:block;
        }

        .error{
            background:#f8d7da;
            color:#721c24;
            display:block;
        }

        /* ---------- LOGIN LINK ---------- */

        .login-link{
            text-align:center;
            margin-top:25px;
            font-size:14px;
        }

        .login-link a{
            text-decoration:none;
            color:var(--primary);
            font-weight:700;
        }

        .login-link a:hover{
            text-decoration:underline;
        }

        @media(max-width:500px){

            .reset-card{
                margin:20px;
                padding:30px 25px;
            }

            h2{
                font-size:1.9rem;
            }
        }

    </style>
</head>

<body>

<!-- FLOATING PAWS -->
<div class="live-bg-wrapper" id="paw-container"></div>

<div class="reset-card">

    <div class="brand-logo">
        <i class="fas fa-paw"></i>
    </div>

    <h2>Reset Password</h2>

    <p class="subtitle">
        Create a strong new password for your account
    </p>

    <div class="input-group-custom">

        <i class="fas fa-lock"></i>

        <input
            type="password"
            id="password"
            class="form-control-custom"
            placeholder="Enter New Password"
        >

    </div>

    <button
        class="reset-btn"
        onclick="resetPassword()"
    >
        <i class="fas fa-key"></i>
        Reset Password
    </button>

    <div class="message" id="message"></div>

    <div class="login-link">
        Back to <a href="/login">Login</a>
    </div>

</div>

<script>

async function resetPassword(){

    const password =
    document.getElementById("password").value;

    const messageDiv =
    document.getElementById("message");

    const button =
    document.querySelector(".reset-btn");

    // GET TOKEN FROM URL
    const token =
    window.location.pathname.split("/").pop();

    if(password.trim() === ""){

        messageDiv.innerHTML =
        "Please enter a password";

        messageDiv.className =
        "message error";

        return;
    }

    button.disabled = true;

    button.innerHTML =
    `<span class="spinner-border spinner-border-sm"></span>
     Resetting...`;

    try{

        const response =
        await fetch(`/api/reset-password/${token}`,{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                password:password
            })

        });

        const data =
        await response.json();

        if(response.ok){

            messageDiv.innerHTML =
            `<i class="fas fa-check-circle"></i>
             ${data.message}`;

            messageDiv.className =
            "message success";

            setTimeout(()=>{

                window.location.href = "/login";

            },2000);

        }else{

            messageDiv.innerHTML =
            `<i class="fas fa-times-circle"></i>
             ${data.error || data.message}`;

            messageDiv.className =
            "message error";
        }

    }catch(error){

        messageDiv.innerHTML =
        `<i class="fas fa-times-circle"></i>
         Something went wrong`;

        messageDiv.className =
        "message error";
    }

    button.disabled = false;

    button.innerHTML =
    `<i class="fas fa-key"></i>
     Reset Password`;
}

/* =========================================
FLOATING PAW ANIMATION
========================================= */

const container =
document.getElementById('paw-container');

function createPaw(){

    const paw =
    document.createElement('i');

    paw.className =
    'fas fa-paw paw-bubble';

    paw.style.left =
    Math.random() * 100 + 'vw';

    paw.style.fontSize =
    Math.random() * 40 + 20 + 'px';

    paw.style.animationDuration =
    Math.random() * 8 + 6 + 's';

    paw.style.opacity =
    Math.random();

    container.appendChild(paw);

    setTimeout(()=>{
        paw.remove();
    },15000);
}

for(let i=0; i<30; i++){
    createPaw();
}

setInterval(createPaw, 2500);

</script>

</body>
</html>
