<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - PawFect Care</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>

@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap');

:root{
    --primary:#ff6b6b;
    --secondary:#4ecdc4;
    --dark:#2d3436;
    --glass:rgba(255,255,255,0.95);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Open Sans',sans-serif;
    background:linear-gradient(-45deg,#ff6ec4,#7873f5,#43cea2,#ff9a9e);
    background-size:400% 400%;
    animation:gradientMove 10s ease infinite;
    min-height:100vh;
}

@keyframes gradientMove{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }
}

/* =========================================
PAW BACKGROUND
========================================= */

.live-bg-wrapper{
    position:fixed;
    inset:0;
    z-index:-1;
    overflow:hidden;
}

.paw-bubble{
    position:absolute;
    bottom:-300px;
    color:rgba(0,0,0,0.35);
    animation:floatUp linear infinite;
    cursor:pointer;
}

@keyframes floatUp{

    from{
        transform:translateY(0) scale(0.8);
        opacity:0;
    }

    to{
        transform:translateY(-120vh) scale(1.4);
        opacity:0.6;
    }
}

/* =========================================
NAVBAR
========================================= */

.navbar{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    width:90%;
    padding:0.8rem 2rem;
    background:rgba(255,255,255,0.9);
    backdrop-filter:blur(15px);
    border-radius:50px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    z-index:9999;
}

.navbar-brand{
    font-weight:700;
    font-size:24px;
    color:#2d3436 !important;
}

/* =========================================
AUTH CARD
========================================= */

.main-auth-card{
    background:rgba(255,255,255,0.92);
    backdrop-filter:blur(18px);
    border:none;
    border-radius:30px;
    overflow:hidden;
    box-shadow:0 25px 60px rgba(0,0,0,0.25);
}

.main-auth-card .card-header{
    border:none;
    padding:25px;
    text-align:center;
    background:linear-gradient(135deg,#ff6b6b,#7873f5);
}

.main-auth-card .card-header h4{
    font-size:30px;
    font-weight:700;
    font-family:'Fredoka',sans-serif;
}

.main-auth-card .card-body{
    padding:35px;
}

/* =========================================
FORM
========================================= */

.form-label{
    font-weight:700;
    margin-bottom:8px;
}

.form-control{
    border:none;
    border-radius:15px;
    padding:14px 15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.form-control:focus{
    box-shadow:0 0 0 3px rgba(255,107,107,0.25);
}

.input-group .btn{
    border-radius:15px;
}

/* =========================================
ROLE CARDS
========================================= */

.role-selection{
    display:grid;
    gap:15px;
}

.role-card{
    position:relative;
    border:2px solid transparent;
    border-radius:20px;
    padding:18px;
    background:rgba(255,255,255,0.9);
    backdrop-filter:blur(10px);
    cursor:pointer;
    transition:0.3s ease;
}

.role-card:hover{
    transform:translateY(-5px);
    box-shadow:0 15px 35px rgba(0,0,0,0.15);
}

.role-card.selected{
    border:2px solid var(--primary);
    transform:scale(1.02);
}

.role-card input{
    display:none;
}

.role-content{
    display:flex;
    align-items:center;
    gap:15px;
}

.role-icon{
    width:60px;
    height:60px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:22px;
}

.pet-owner .role-icon{
    background:linear-gradient(135deg,#ff6b6b,#ff9a9e);
}

.salon-owner .role-icon{
    background:linear-gradient(135deg,#7873f5,#5b4bff);
}

.doctor .role-icon{
    background:linear-gradient(135deg,#43cea2,#2ebf91);
}

.role-title{
    font-size:18px;
    font-weight:700;
}

.role-desc{
    font-size:13px;
    color:#666;
}

/* =========================================
BUTTONS
========================================= */

.btn-success{
    border:none;
    border-radius:50px;
    padding:13px;
    font-size:17px;
    font-weight:700;
    background:linear-gradient(135deg,#ff6b6b,#7873f5);
    transition:0.3s ease;
}

.btn-success:hover{
    transform:translateY(-3px);
}

/* =========================================
LINKS
========================================= */

a{
    text-decoration:none;
    font-weight:700;
    color:#7873f5;
}

a:hover{
    color:#ff6b6b;
}

/* =========================================
RESPONSIVE
========================================= */

@media(max-width:768px){

    .main-auth-card .card-body{
        padding:25px;
    }
}

    </style>
</head>

<body>

<div class="live-bg-wrapper" id="paw-container"></div>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg">

    <div class="container-fluid">

        <a class="navbar-brand" href="/">
            <i class="fas fa-paw"></i> PawFect Care
        </a>

    </div>

</nav>

<!-- REGISTER FORM -->

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6 col-md-8 mt-5 pt-5">

            <div class="card shadow main-auth-card">

                <div class="card-header text-white">

                    <h4 class="mb-0">
                        Create Account
                    </h4>

                </div>

                <div class="card-body">

                    <div id="alert-area"></div>

                    <form id="register-form" autocomplete="off">

                        <!-- USERNAME -->

                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input
                            type="text"
                            class="form-control"
                            id="username"
                            placeholder="Enter your username"
                            required>

                        </div>

                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                            type="email"
                            class="form-control"
                            id="email"
                            placeholder="Enter your email"
                            required>

                        </div>

                        <!-- PASSWORD -->

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <div class="input-group">

                                <input
                                type="password"
                                class="form-control"
                                id="password"
                                placeholder="Create a strong password"
                                autocomplete="new-password"
                                required>

                                <button
                                class="btn btn-outline-secondary"
                                type="button"
                                onclick="togglePassword('password')">

                                    <i class="fas fa-eye"></i>

                                </button>

                            </div>

                            <div id="passwordStrength" class="mt-2"></div>

                        </div>

                        <!-- CONFIRM PASSWORD -->

                        <div class="mb-4">

                            <label class="form-label">
                                Confirm Password
                            </label>

                            <div class="input-group">

                                <input
                                type="password"
                                class="form-control"
                                id="confirm_password"
                                placeholder="Re-enter password"
                                autocomplete="new-password"
                                required>

                                <button
                                class="btn btn-outline-secondary"
                                type="button"
                                onclick="togglePassword('confirm_password')">

                                    <i class="fas fa-eye"></i>

                                </button>

                            </div>

                        </div>

                        <!-- ROLE CARDS -->

                        <div class="mb-4">

                            <label class="form-label">
                                Choose Your Role
                            </label>

                            <div class="role-selection">

                                <!-- PET OWNER -->

                                <label class="role-card pet-owner">

                                    <input
                                    type="radio"
                                    name="role"
                                    value="Pet_Owner"
                                    required>

                                    <div class="role-content">

                                        <div class="role-icon">
                                            <i class="fas fa-paw"></i>
                                        </div>

                                        <div>

                                            <div class="role-title">
                                                Pet Owner
                                            </div>

                                            <div class="role-desc">
                                                Book salons & manage pets
                                            </div>

                                        </div>

                                    </div>

                                </label>

                                <!-- SALON OWNER -->

                                <label class="role-card salon-owner">

                                    <input
                                    type="radio"
                                    name="role"
                                    value="Salon_Owner">

                                    <div class="role-content">

                                        <div class="role-icon">
                                            <i class="fas fa-cut"></i>
                                        </div>

                                        <div>

                                            <div class="role-title">
                                                Salon Owner
                                            </div>

                                            <div class="role-desc">
                                                Manage bookings & services
                                            </div>

                                        </div>

                                    </div>

                                </label>

                                <!-- DOCTOR -->

                                <label class="role-card doctor">

                                    <input
                                    type="radio"
                                    name="role"
                                    value="Doctor">

                                    <div class="role-content">

                                        <div class="role-icon">
                                            <i class="fas fa-user-doctor"></i>
                                        </div>

                                        <div>

                                            <div class="role-title">
                                                Doctor
                                            </div>

                                            <div class="role-desc">
                                                Handle pet appointments
                                            </div>

                                        </div>

                                    </div>

                                </label>

                            </div>

                        </div>

                        <!-- BUTTON -->

                        <button
                        type="submit"
                        class="btn btn-success w-100">

                            Register

                        </button>

                    </form>

                    <hr>

                    <p class="text-center mb-0">

                        Already have an account?

                        <a href="/login">
                            Login
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- JAVASCRIPT -->

<script>

/* =========================================
SHOW / HIDE PASSWORD
========================================= */

function togglePassword(fieldId){

    const field =
    document.getElementById(fieldId);

    field.type =
    field.type === "password"
    ? "text"
    : "password";
}

/* =========================================
ROLE CARD SELECTION
========================================= */

document.querySelectorAll('.role-card')
.forEach(card => {

    card.addEventListener('click', () => {

        document
        .querySelectorAll('.role-card')
        .forEach(c => c.classList.remove('selected'));

        card.classList.add('selected');
    });

});

/* =========================================
PASSWORD STRENGTH
========================================= */

document
.getElementById("password")
.addEventListener("input", function(){

    const password = this.value;

    const strength =
    document.getElementById("passwordStrength");

    if(password.length < 6){

        strength.innerHTML =
        "<small class='text-danger fw-bold'>Weak Password</small>";
    }

    else if(password.length < 10){

        strength.innerHTML =
        "<small class='text-warning fw-bold'>Medium Password</small>";
    }

    else{

        strength.innerHTML =
        "<small class='text-success fw-bold'>Strong Password</small>";
    }
});

/* =========================================
REGISTER
========================================= */

document
.getElementById('register-form')
.addEventListener('submit', async function(e){

    e.preventDefault();

    const alertArea =
    document.getElementById('alert-area');

    const submitBtn =
    document.querySelector(
    '#register-form button[type="submit"]'
    );

    const username =
    document.getElementById('username')
    .value.trim();

    const email =
    document.getElementById('email')
    .value.trim();

    const password =
    document.getElementById('password')
    .value.trim();

    const confirmPassword =
    document.getElementById('confirm_password')
    .value.trim();

    const selectedRole =
    document.querySelector(
    'input[name="role"]:checked'
    )?.value;

    if(!selectedRole){

        alertArea.innerHTML =
        `<div class="alert alert-warning">
            Please select a role
        </div>`;

        return;
    }

    if(password !== confirmPassword){

        alertArea.innerHTML =
        `<div class="alert alert-danger">
            Passwords do not match
        </div>`;

        return;
    }

    submitBtn.disabled = true;

    submitBtn.innerHTML =
    `<span class="spinner-border spinner-border-sm"></span>
     Registering...`;

    try{

        const res = await fetch('/api/register',{

            method:'POST',

            headers:{
                'Content-Type':'application/json'
            },

            body:JSON.stringify({

                username:username,
                email:email,
                password:password,
                role:selectedRole
            })
        });

        const data = await res.json();

        if(res.ok){

            alertArea.innerHTML =
            `<div class="alert alert-success">
                ${data.message}
            </div>`;

            setTimeout(()=>{

                location.href = '/login';

            },1500);

        }else{

            alertArea.innerHTML =
            `<div class="alert alert-danger">
                ${data.error}
            </div>`;
        }

    }catch(error){

        console.error(error);

        alertArea.innerHTML =
        `<div class="alert alert-danger">
            Server connection failed
        </div>`;
    }

    submitBtn.disabled = false;

    submitBtn.innerHTML = "Register";
});

/* =========================================
FLOATING PAWS
========================================= */

const container =
document.getElementById('paw-container');

function createPaw(){

    const paw =
    document.createElement('i');

    paw.className =
    'fas fa-paw paw-bubble';

    paw.style.left =
    Math.random() * 100 + 'vw';

    paw.style.fontSize =
    Math.random() * 40 + 20 + 'px';

    paw.style.animationDuration =
    Math.random() * 8 + 6 + 's';

    paw.onmouseenter = () => paw.remove();

    container.appendChild(paw);
}

for(let i=0; i<30; i++) createPaw();

setInterval(createPaw,3000);

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
